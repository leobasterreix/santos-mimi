<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('site-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · Santos &amp; Mimi</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Major+Mono+Display&family=Outfit:wght@300;500;800&family=Italiana&display=swap" rel="stylesheet" />
  <style>
    :root, html[data-theme="light"] {
      --bg-color: #fdf6e3;
      --bg-overlay: rgba(253, 246, 227, 0.70);
      --text-color: #1a1230;
      --subtitle-color: rgba(26, 18, 48, 0.75);
      --kicker-color: #8b1e2b;
      --btn-bg: linear-gradient(135deg, #8b1e2b, #e8506f, #b91d6a);
      --btn-shadow: rgba(232, 80, 111, 0.38);
      --radial-1: rgba(232, 80, 111, 0.15);
      --radial-2: rgba(217, 119, 6, 0.12);
      --cursor-ring-color: rgba(196, 30, 58, 0.55);
      --cursor-dot-glow: #d63384;
      --glass-bg: rgba(255, 247, 237, 0.55);
      --glass-border: rgba(196, 30, 58, 0.18);
    }

    html[data-theme="dark"] {
      --bg-color: #0f0913;
      --bg-overlay: rgba(15, 9, 19, 0.65);
      --text-color: #f3f0f7;
      --subtitle-color: rgba(243, 240, 247, 0.75);
      --kicker-color: #ff4a68;
      --btn-bg: linear-gradient(135deg, #ff4a68, #db2777, #a855f7);
      --btn-shadow: rgba(219, 39, 119, 0.16);
      --radial-1: rgba(168, 85, 247, 0.15);
      --radial-2: rgba(251, 191, 36, 0.12);
      --cursor-ring-color: rgba(251, 191, 36, 0.55);
      --cursor-dot-glow: #ff4a68;
      --glass-bg: rgba(26, 16, 36, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    html[data-theme="abyss"] {
      --bg-color: #020c12;
      --bg-overlay: rgba(2, 12, 18, 0.55);
      --text-color: #e0f2fe;
      --subtitle-color: rgba(224, 242, 254, 0.7);
      --kicker-color: #7dd3fc;
      --btn-bg: linear-gradient(135deg, #0e7490, #22d3ee, #0891b2);
      --btn-shadow: rgba(34, 211, 238, 0.15);
      --radial-1: rgba(14, 116, 144, 0.20);
      --radial-2: rgba(34, 211, 238, 0.12);
      --cursor-ring-color: rgba(214, 51, 132, 0.55);
      --cursor-dot-glow: #d63384;
      --glass-bg: rgba(5, 25, 38, 0.55);
      --glass-border: rgba(34, 211, 238, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }
    html::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg-color);
      height: 100vh;
      overflow: hidden;
      cursor: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -10px;
      background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('images/404_fond.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(8px);
      z-index: -1;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 65% 45% at 8%  18%, var(--radial-1) 0%, transparent 65%),
        radial-gradient(ellipse 55% 40% at 92% 82%, var(--radial-2) 0%, transparent 65%);
      pointer-events: none;
      z-index: -1;
    }

    /* ── Cursor ── */
    .cursor-dot, .cursor-ring {
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999; will-change: transform;
    }
    .cursor-dot {
      width: 8px; height: 8px;
      background: radial-gradient(circle, #fff 0%, var(--cursor-dot-glow) 80%);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cursor-dot-glow), 0 0 16px var(--cursor-dot-glow);
    }
    .cursor-ring {
      width: 38px; height: 38px;
      border: 1.5px solid var(--cursor-ring-color);
      border-radius: 50%;
      transition: transform 0.18s ease, border-color 0.18s ease;
      mix-blend-mode: screen;
    }

    /* ── Pas de curseur custom sur tactile / mobile ── */
    @media (hover: none), (pointer: coarse) {
      .cursor-dot, .cursor-ring { display: none !important; }
      body, .home-link { cursor: auto; }
    }

    /* ── Text labels ── */
    .kicker {
      position: relative; z-index: 2;
      font-family: 'Italiana', serif;
      font-size: 0.8rem; letter-spacing: 0.6em;
      text-transform: uppercase;
      color: var(--kicker-color);
      text-align: center;
    }

    /* ── SVG stage ── */
    #stage {
      position: relative; z-index: 2;
      flex-shrink: 0;
    }

    .bead-container {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--left);
      top: var(--top);
      transform-origin: center center;
      pointer-events: none;
      /* Gather first, then float */
      animation: 
        gatherBeads 2.0s cubic-bezier(0.19, 1, 0.22, 1) both,
        cellFloat 4.0s ease-in-out infinite 2.0s;
      z-index: 2;
    }

    .bead-image-inner {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    /* Bead gathering from all directions */
    @keyframes gatherBeads {
      0% {
        transform: translate(var(--startX), var(--startY)) rotate(var(--startRot)) scale(0.2);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      100% {
        transform: translate(0, 0) rotate(var(--targetRot)) scale(1);
        opacity: 1;
      }
    }

    /* Gentle individual float once gathered */
    @keyframes cellFloat {
      0%, 100% { transform: translateY(0px) rotate(var(--targetRot)); }
      50%       { transform: translateY(-6px) rotate(var(--targetRot)); }
    }

    .subtitle {
      position: relative; z-index: 2;
      font-family: 'Caveat', cursive;
      font-size: clamp(1.2rem, 2.4vw, 1.8rem);
      font-weight: 700;
      color: var(--subtitle-color);
      text-align: center;
    }
    .home-link {
      position: relative; z-index: 2;
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.8rem 2rem;
      border-radius: 999px;
      background: var(--btn-bg);
      color: #fff; text-decoration: none; cursor: none;
      box-shadow: 0 10px 28px var(--btn-shadow);
      transition: box-shadow 0.25s ease;
    }
    .home-link:hover {
      box-shadow: 0 16px 36px var(--btn-shadow);
    }
    .home-link .scroll-text {
      display: inline-flex;
      overflow: hidden;
      line-height: 1.4;
    }
    .home-link .letter { display: inline-block; }
    .home-link:hover .letter {
      animation: letter-stair 0.55s cubic-bezier(0.4, 0, 0.2, 1) both;
      animation-delay: calc(var(--i) * 0.04s);
    }
    @keyframes letter-stair {
      0%   { translate: 0 0;     opacity: 1; }
      38%  { translate: 0 14px;  opacity: 0; }
      39%  { translate: 0 -14px; opacity: 0; }
      100% { translate: 0 0;     opacity: 1; }
    }
    .home-link svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.5px;
    }

    /* ─── Bouton thème flottant ────────────────────────── */
    .theme-btn {
      position: fixed; top: 1.3rem; left: 1.3rem;
      z-index: 9100;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      color: var(--text-color);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(60, 10, 30, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      cursor: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s, border-color 0.3s, color 0.3s;
      padding: 0;
    }
    html[data-theme="dark"] .theme-btn {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .theme-btn:hover {
      transform: scale(1.08);
      background: rgba(255, 247, 237, 0.85);
      color: var(--kicker-color);
      border-color: var(--kicker-color);
    }
    html[data-theme="dark"] .theme-btn:hover {
      background: rgba(26, 16, 36, 0.85);
      color: var(--kicker-color);
      border-color: var(--kicker-color);
    }
    .theme-btn:active {
      transform: scale(0.95);
    }
    .theme-btn svg {
      width: 20px; height: 20px;
      display: block;
      stroke-width: 2.2px;
    }

    .particles, .ripples {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .particles { z-index: 3; }
    .ripples { z-index: 2; mix-blend-mode: screen; }


  </style>
</head>
<body>
  <div class="cursor-ring" id="cRing"></div>
  <div class="cursor-dot"  id="cDot"></div>
  
  <!-- Bouton Thème (Sombre/Clair) -->
  <button class="theme-btn" id="themeBtn" type="button" aria-label="Passer au mode sombre">
    <i data-lucide="sun" class="icon-sun" aria-hidden="true" style="display: none;"></i>
    <i data-lucide="moon" class="icon-moon" aria-hidden="true"></i>
  </button>
  <canvas class="particles" id="pCanvas"></canvas>
  <canvas class="ripples"   id="rCanvas"></canvas>

  <div id="stage"></div>
  <p class="subtitle">cette page s'est perdue en mer 🌊</p>
  <a class="home-link" href="index.html"><i data-lucide="arrow-left" aria-hidden="true"></i> retour à l'accueil</a>


  <script>
  const IMGS = [
    'images/image%2037.png','images/image%2038.png','images/image%2039.png',
    'images/image%2040.png','images/image%2041.png','images/image%2042.png',
    'images/image%2043.png','images/image%2044.png','images/image%2045.png',
    'images/image%2046.png','images/image%2047.png','images/image%2048.png',
    'images/image%2049.png','images/image%2050.png','images/image%2051.png',
    'images/image%2052.png','images/image%2053.png','images/image%2054.png',
    'images/image%2055.png','images/image%2057.png','images/image%2058.png',
    'images/image%2059.png','images/image%2060.png','images/image%2062.png',
    'images/image%2063.png','images/image%2064.png','images/image%2065.png',
    'images/image%2066.png','images/image%2067.png','images/image%2068.png',
    'images/image%2069.png','images/image%2072.png','images/image%2073.png',
    'images/image%2075.png','images/image%2076.png','images/image%2078.png',
    'images/image%2081.png','images/image%2082.png','images/image%2084.png',
    'images/image%2085.png','images/image%2086.png','images/image%2087.png',
  ];

  /* ─── Build using SVG path sampling ─── */
  let activeBeads = [];
  build();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(build);
  }

  function build() {
    const stage = document.getElementById('stage');
    stage.innerHTML = ''; // Clear stage in case of re-runs

    /* Stage dimensions */
    const maxH = window.innerHeight - 170;
    const W = Math.round(Math.min(window.innerWidth * 0.96, 1100, maxH / 0.34));
    const H = Math.round(W * 0.34);
    stage.style.width  = W + 'px';
    stage.style.height = H + 'px';

    /* Grid cell size — size of each charm */
    const cell = Math.round(Math.min(58, Math.max(38, H / 7.8)));

    /* Stroke paths of '404' in a 1000x340 coordinate system (aligned symmetrically with 70px gaps) */
    const pathData = [
      // First '4' (shifted right by 50px to span 130 to 310)
      "M 260,50 L 130,230 L 310,230",
      "M 250,80 L 250,290",
      // '0' (centered at 500, spanning 380 to 620)
      "M 500,50 A 120,120 0 1,0 500,290 A 120,120 0 1,0 500,50 Z",
      // Second '4' (shifted left by 10px to span 690 to 870)
      "M 820,50 L 690,230 L 870,230",
      "M 810,80 L 810,290"
    ];

    const points = [];
    const tempSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    const step = cell * 0.46; // Balanced spacing along path strokes

    pathData.forEach(d => {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      tempSvg.appendChild(path);
      
      const totalLength = path.getTotalLength();
      const numPoints = Math.max(3, Math.round(totalLength / step));
      
      for (let i = 0; i <= numPoints; i++) {
        const length = (i / numPoints) * totalLength;
        const pt = path.getPointAtLength(length);
        
        // Scale coordinate space (1000x340) to actual stage dimensions W and H
        const px = (pt.x / 1000) * W;
        const py = (pt.y / 340) * H;
        
        // Place 2 staggered beads at each step to thicken the stroke organically
        const beadsPerPoint = 2;
        for (let k = 0; k < beadsPerPoint; k++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * cell * 0.36; // Wide enough to double the stroke thickness
          const jx = Math.cos(angle) * dist;
          const jy = Math.sin(angle) * dist;
          
          points.push({ x: px + jx, y: py + jy });
        }
      }
    });

    /* Shuffle images to randomly distribute them */
    const deck = [...IMGS];
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }

    activeBeads = []; // Reset active beads list

    // Append charm image elements directly
    points.forEach((pt, index) => {
      const src = deck[index % deck.length];

      // Create container (handles position, layout and floating/gathering animations)
      const container = document.createElement('div');
      container.className = 'bead-container';

      // Create inner image (handles smooth hover push transitions in JS)
      const img = document.createElement('img');
      img.src = src;
      img.className = 'bead-image-inner';

      // Set random offscreen start coordinates for the gather animation
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.max(window.innerWidth, window.innerHeight) * 0.8 + Math.random() * 200;
      const startX = Math.cos(angle) * dist;
      const startY = Math.sin(angle) * dist;

      // Random rotations
      const startRot = Math.round((Math.random() - 0.5) * 540);
      const targetRot = Math.round((Math.random() - 0.5) * 40);

      // Stagger the gather animation
      const delay = (Math.random() * 0.6).toFixed(3);

      container.style.setProperty('--size', `${cell}px`);
      container.style.setProperty('--left', `${pt.x - cell / 2}px`);
      container.style.setProperty('--top', `${pt.y - cell / 2}px`);
      container.style.setProperty('--startX', `${Math.round(startX)}px`);
      container.style.setProperty('--startY', `${Math.round(startY)}px`);
      container.style.setProperty('--startRot', `${startRot}deg`);
      container.style.setProperty('--targetRot', `${targetRot}deg`);
      
      // Delay both gatherBeads and cellFloat on the container
      container.style.animationDelay = `${delay}s, ${(2.0 + parseFloat(delay)).toFixed(3)}s`;

      container.appendChild(img);
      stage.appendChild(container);

      // Save metadata for hover proximity tracking
      activeBeads.push({
        el: img,
        px: pt.x,
        py: pt.y
      });
    });
  }

  /* ─── Cursor (scale handled in JS — no CSS !important conflict) ─── */
  const cDot  = document.getElementById('cDot');
  const cRing = document.getElementById('cRing');
  let mx = innerWidth / 2, my = innerHeight / 2;
  let rx = mx, ry = my, rScale = 1;

  document.addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    if (cDot) {
      cDot.style.transform = `translate(${mx - 4}px,${my - 4}px)`;
    }
  });
  document.querySelectorAll('a, .theme-btn').forEach(el => {
    el.addEventListener('mouseenter', () => {
      rScale = 1.6;
      if (cRing) {
        cRing.style.borderColor = 'var(--kicker-color)';
      }
    });
    el.addEventListener('mouseleave', () => {
      rScale = 1;
      if (cRing) {
        cRing.style.borderColor = 'var(--cursor-ring-color)';
      }
    });
  });


  (function tick() {
    rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
    cRing.style.transform = `translate(${rx - 19}px,${ry - 19}px) scale(${rScale})`;

    // Proximity hover effect on charms (desktop / pointer interactions)
    const stage = document.getElementById('stage');
    if (stage && activeBeads.length > 0) {
      const rect = stage.getBoundingClientRect();
      const stageX = rect.left;
      const stageY = rect.top;
      const mouseStageX = mx - stageX;
      const mouseStageY = my - stageY;

      const threshold = 95; // Radius of proximity in pixels

      activeBeads.forEach(bead => {
        const dx = bead.px - mouseStageX;
        const dy = bead.py - mouseStageY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < threshold) {
          const force = (threshold - dist) / threshold; // 0 (far) to 1 (on top)
          const angle = Math.atan2(dy, dx);
          
          // Push bead away slightly (up to 20px)
          const pushDist = force * 20; 
          const pushX = Math.cos(angle) * pushDist;
          const pushY = Math.sin(angle) * pushDist;

          // Rotate slightly based on push force
          const pushRot = pushX * 0.5;

          bead.el.style.transform = `translate(${pushX.toFixed(1)}px, ${pushY.toFixed(1)}px) rotate(${pushRot.toFixed(1)}deg) scale(1.12)`;
        } else {
          bead.el.style.transform = 'translate(0px, 0px) rotate(0deg) scale(1)';
        }
      });
    }

    requestAnimationFrame(tick);
  })();

  /* ─── Particules + ondulations (identiques à la page d'accueil) ─── */
  const pCanvas = document.querySelector('.particles');
  const pCtx = pCanvas.getContext('2d');
  function fit(c) { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; c.getContext('2d').scale(devicePixelRatio, devicePixelRatio); }
  fit(pCanvas);

  const SHAPES = ['sparkle', 'shell', 'sand', 'star', 'gem'];
  const COLORS = ['#c41e3a', '#d63384', '#f59e0b', '#10b981', '#2dd4bf', '#8b5cf6', '#fff7ec', '#f4e4c1'];

  class Particle {
    constructor(x, y, opts = {}) {
      this.x = x; this.y = y;
      this.vx = opts.vx ?? (Math.random() - 0.5) * 2.2;
      this.vy = opts.vy ?? (Math.random() * -2 - 0.5);
      this.size = opts.size ?? (Math.random() * 6 + 3);
      this.life = 1;
      this.decay = opts.decay ?? 0.008;
      this.gravity = opts.gravity ?? 0.04;
      this.shape = opts.shape ?? SHAPES[(Math.random() * SHAPES.length) | 0];
      this.color = opts.color ?? COLORS[(Math.random() * COLORS.length) | 0];
      this.rot = Math.random() * Math.PI * 2;
      this.spin = (Math.random() - 0.5) * 0.1;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.gravity;
      this.vx *= 0.995;
      this.rot += this.spin;
      this.life -= this.decay;
    }
    draw(ctx) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.life);
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.fillStyle = this.color;
      ctx.strokeStyle = this.color;

      if (this.shape === 'sparkle') {
        const s = this.size;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) { ctx.moveTo(0, 0); ctx.lineTo(0, -s); ctx.rotate(Math.PI / 2); }
        ctx.rotate(Math.PI / 4);
        for (let i = 0; i < 4; i++) { ctx.moveTo(0, 0); ctx.lineTo(0, -s * 0.55); ctx.rotate(Math.PI / 2); }
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.18, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.shape === 'star') {
        const s = this.size;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(0, -s);
          ctx.translate(0, -s);
          ctx.rotate((Math.PI * 2) / 10);
          ctx.lineTo(0, -s * 0.4);
          ctx.translate(0, -s * 0.4);
          ctx.rotate(-(Math.PI * 6) / 10);
        }
        ctx.lineTo(0, -s); ctx.closePath(); ctx.fill();
      } else if (this.shape === 'gem') {
        const s = this.size;
        ctx.beginPath();
        ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.7, 0);
        ctx.closePath(); ctx.fill();
      } else if (this.shape === 'shell') {
        ctx.font = `${this.size * 2.4}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🐚', 0, 0);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  const particles = [];
  let lastEmit = 0;

  document.addEventListener('pointermove', e => {
    const now = performance.now();
    if (now - lastEmit < 40) return;
    lastEmit = now;
    particles.push(new Particle(e.clientX + (Math.random() - 0.5) * 10, e.clientY + (Math.random() - 0.5) * 10, {
      vx: (Math.random() - 0.5) * 1.4,
      vy: (Math.random() - 0.5) * 1.4 - 0.5,
      gravity: 0.02, decay: 0.022,
      size: Math.random() * 5 + 3,
      shape: Math.random() < 0.6 ? 'sparkle' : (Math.random() < 0.5 ? 'star' : 'gem'),
    }));
  }, { passive: true });

  document.addEventListener('click', e => {
    for (let i = 0; i < 24; i++) {
      const a = (Math.PI * 2 * i) / 24;
      particles.push(new Particle(e.clientX, e.clientY, {
        vx: Math.cos(a) * (Math.random() * 4 + 1.5),
        vy: Math.sin(a) * (Math.random() * 4 + 1.5) - 1,
        gravity: 0.06, decay: 0.012,
        size: Math.random() * 7 + 4,
      }));
    }
    spawnRipple(e.clientX, e.clientY, 1.4);
  });

  function ambient() {
    particles.push(new Particle(Math.random() * innerWidth, -10, {
      vx: (Math.random() - 0.5) * 0.3,
      vy: Math.random() * 0.6 + 0.2,
      gravity: 0.005, decay: 0.003,
      size: Math.random() * 2 + 1,
      shape: 'sand',
      color: Math.random() < 0.5 ? '#f4e4c1' : '#fff'
    }));
  }
  setInterval(ambient, 90);

  /* Water ripples */
  const rCanvas = document.querySelector('.ripples');
  const rCtx = rCanvas.getContext('2d');
  fit(rCanvas);

  const ripples = [];
  class Ripple {
    constructor(x, y, strength = 1) {
      this.x = x; this.y = y;
      this.r = 4; this.maxR = 140 * strength;
      this.life = 1; this.decay = 0.018 / strength;
    }
    update() { this.r += 2.4; this.life -= this.decay; }
    draw(ctx) {
      const alpha = Math.max(0, this.life);
      ctx.save();
      ctx.strokeStyle = `rgba(0, 212, 255, ${alpha * 0.6})`;
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(214, 51, 132, ${alpha * 0.4})`;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.7, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  function spawnRipple(x, y, s = 1) { ripples.push(new Ripple(x, y, s)); }

  let lastRipple = 0;
  document.addEventListener('pointermove', e => {
    const now = performance.now();
    if (now - lastRipple > 140) {
      lastRipple = now;
      spawnRipple(e.clientX, e.clientY, 0.6);
    }
  }, { passive: true });

  let tabVisible = !document.hidden;
  document.addEventListener('visibilitychange', () => { tabVisible = !document.hidden; });

  function loop() {
    if (tabVisible) {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.update(); p.draw(pCtx);
        if (p.life <= 0 || p.y > innerHeight + 50) particles.splice(i, 1);
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i]; r.update(); r.draw(rCtx);
        if (r.life <= 0) ripples.splice(i, 1);
      }
    }
    requestAnimationFrame(loop);
  }
  loop();

  addEventListener('resize', () => { fit(pCanvas); fit(rCanvas); });
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
    /* ── Split 'retour à l’accueil' into letter spans ── */
    (function () {
      const btn = document.querySelector('.home-link');
      if (!btn) return;
      const icon = btn.querySelector('svg') || btn.querySelector('i');
      const text = "retour \u00e0 l'accueil";
      const wrapped = [...text].map((ch, i) =>
        ch === ' '
          ? `<span class="letter" style="--i:${i}" aria-hidden="true">&nbsp;</span>`
          : `<span class="letter" style="--i:${i}" aria-hidden="true">${ch}</span>`
      ).join('');
      const iconHTML = icon ? icon.outerHTML : '';
      btn.innerHTML = iconHTML +
        `<span class="scroll-text" aria-label="retour \u00e0 l'accueil">${wrapped}</span>`;
      lucide.createIcons();
    })();

    /* ── Bouton Thème (Sombre/Clair) et gestion du thème ── */
    (function initTheme() {
      const btn = document.getElementById('themeBtn');
      if (!btn) return;
      const iconSun = btn.querySelector('.icon-sun');
      const iconMoon = btn.querySelector('.icon-moon');

      function updateUI(theme) {
        if (theme === 'dark') {
          iconSun.style.display = 'block';
          iconMoon.style.display = 'none';
          btn.setAttribute('aria-label', 'Passer au mode clair');
        } else {
          iconSun.style.display = 'none';
          iconMoon.style.display = 'block';
          btn.setAttribute('aria-label', 'Passer au mode sombre');
        }
      }

      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      updateUI(currentTheme);

      btn.addEventListener('click', () => {
        const activeTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', activeTheme);
        try {
          localStorage.setItem('site-theme', activeTheme);
        } catch (e) {}
        updateUI(activeTheme);
      });
    })();
  </script>
</body>
</html>
