<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · Santos &amp; Mimi</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Major+Mono+Display&family=Outfit:wght@300;500;800&family=Italiana&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #020c12;
      height: 100vh;
      overflow: hidden;
      cursor: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.2rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -10px;
      background-image: linear-gradient(rgba(2, 12, 18, 0.55), rgba(2, 12, 18, 0.55)), url('images/404_fond.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(8px);
      z-index: -1;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 65% 45% at 8%  18%, rgba(14,116,144,0.20) 0%, transparent 65%),
        radial-gradient(ellipse 55% 40% at 92% 82%, rgba(34,211,238,0.12) 0%, transparent 65%);
      pointer-events: none;
      z-index: -1;
    }

    /* ── Cursor ── */
    .cursor-dot, .cursor-ring {
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999; will-change: transform;
    }
    .cursor-dot {
      width: 8px; height: 8px;
      background: radial-gradient(circle, #fff 0%, #d63384 80%);
      border-radius: 50%;
      box-shadow: 0 0 12px #d63384, 0 0 24px #e8506f;
    }
    .cursor-ring {
      width: 38px; height: 38px;
      border: 1.5px solid rgba(214, 51, 132, 0.55);
      border-radius: 50%;
      transition: transform 0.18s ease, border-color 0.18s ease;
      mix-blend-mode: screen;
    }

    /* ── Pas de curseur custom sur tactile / mobile ── */
    @media (hover: none), (pointer: coarse) {
      .cursor-dot, .cursor-ring { display: none !important; }
      body, .home-link { cursor: auto; }
    }

    /* ── Text labels ── */
    .kicker {
      position: relative; z-index: 2;
      font-family: 'Italiana', serif;
      font-size: 0.8rem; letter-spacing: 0.6em;
      text-transform: uppercase;
      color: #7dd3fc; opacity: 0.6;
      text-align: center;
    }

    /* ── SVG stage ── */
    #stage {
      position: relative; z-index: 2;
      flex-shrink: 0;
    }

    .bead-image {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--left);
      top: var(--top);
      transform-origin: center center;
      pointer-events: none;
      /* Gather first, then float */
      animation: 
        gatherBeads 2.0s cubic-bezier(0.19, 1, 0.22, 1) both,
        cellFloat 4.0s ease-in-out infinite 2.0s;
      z-index: 2;
    }

    /* Bead gathering from all directions */
    @keyframes gatherBeads {
      0% {
        transform: translate(var(--startX), var(--startY)) rotate(var(--startRot)) scale(0.2);
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      100% {
        transform: translate(0, 0) rotate(var(--targetRot)) scale(1);
        opacity: 1;
      }
    }

    /* Gentle individual float once gathered */
    @keyframes cellFloat {
      0%, 100% { transform: translateY(0px) rotate(var(--targetRot)); }
      50%       { transform: translateY(-6px) rotate(var(--targetRot)); }
    }

    .subtitle {
      position: relative; z-index: 2;
      font-family: 'Caveat', cursive;
      font-size: clamp(1.2rem, 2.4vw, 1.8rem);
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      text-align: center;
    }
    .home-link {
      position: relative; z-index: 2;
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.8rem 2rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #0e7490, #22d3ee, #0891b2);
      color: #fff; text-decoration: none; cursor: none;
      box-shadow: 0 10px 28px rgba(34,211,238,0.38);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .home-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(34,211,238,0.56);
    }

    .particles, .ripples {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .particles { z-index: 3; }
    .ripples { z-index: 2; mix-blend-mode: screen; }
  </style>
</head>
<body>
  <div class="cursor-ring" id="cRing"></div>
  <div class="cursor-dot"  id="cDot"></div>
  <canvas class="particles" id="pCanvas"></canvas>
  <canvas class="ripples"   id="rCanvas"></canvas>

  <div id="stage"></div>
  <p class="subtitle">cette page s'est perdue en mer 🌊</p>
  <a class="home-link" href="index.html">← retour à l'accueil</a>

  <script>
  const IMGS = [
    'images/image%2037.png','images/image%2038.png','images/image%2039.png',
    'images/image%2040.png','images/image%2041.png','images/image%2042.png',
    'images/image%2043.png','images/image%2044.png','images/image%2045.png',
    'images/image%2046.png','images/image%2047.png','images/image%2048.png',
    'images/image%2049.png','images/image%2050.png','images/image%2051.png',
    'images/image%2052.png','images/image%2053.png','images/image%2054.png',
    'images/image%2055.png','images/image%2057.png','images/image%2058.png',
    'images/image%2059.png','images/image%2060.png','images/image%2062.png',
    'images/image%2063.png','images/image%2064.png','images/image%2065.png',
    'images/image%2066.png','images/image%2067.png','images/image%2068.png',
    'images/image%2069.png','images/image%2072.png','images/image%2073.png',
    'images/image%2075.png','images/image%2076.png','images/image%2078.png',
    'images/image%2081.png','images/image%2082.png','images/image%2084.png',
    'images/image%2085.png','images/image%2086.png','images/image%2087.png',
  ];

  /* ─── Build using Canvas pixel-sampling ─── */
  document.fonts.ready.then(build);

  function build() {
    const stage = document.getElementById('stage');
    stage.innerHTML = ''; // Clear stage in case of re-runs

    /* Stage dimensions */
    const maxH = window.innerHeight - 170;
    const W = Math.round(Math.min(window.innerWidth * 0.96, 1100, maxH / 0.34));
    const H = Math.round(W * 0.34);
    stage.style.width  = W + 'px';
    stage.style.height = H + 'px';

    /* Grid cell size — size of each charm */
    const cell = Math.round(Math.min(58, Math.max(38, H / 7.8)));

    /* Stroke paths of '404' in a 1000x340 coordinate system (aligned symmetrically with 70px gaps) */
    const pathData = [
      // First '4' (shifted right by 50px to span 130 to 310)
      "M 260,50 L 130,230 L 310,230",
      "M 250,80 L 250,290",
      // '0' (centered at 500, spanning 380 to 620)
      "M 500,50 A 120,120 0 1,0 500,290 A 120,120 0 1,0 500,50 Z",
      // Second '4' (shifted left by 10px to span 690 to 870)
      "M 820,50 L 690,230 L 870,230",
      "M 810,80 L 810,290"
    ];

    const points = [];
    const tempSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    const step = cell * 0.46; // Balanced spacing along path strokes

    pathData.forEach(d => {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      tempSvg.appendChild(path);
      
      const totalLength = path.getTotalLength();
      const numPoints = Math.max(3, Math.round(totalLength / step));
      
      for (let i = 0; i <= numPoints; i++) {
        const length = (i / numPoints) * totalLength;
        const pt = path.getPointAtLength(length);
        
        // Scale coordinate space (1000x340) to actual stage dimensions W and H
        const px = (pt.x / 1000) * W;
        const py = (pt.y / 340) * H;
        
        // Place 2 staggered beads at each step to thicken the stroke organically
        const beadsPerPoint = 2;
        for (let k = 0; k < beadsPerPoint; k++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * cell * 0.36; // Wide enough to double the stroke thickness
          const jx = Math.cos(angle) * dist;
          const jy = Math.sin(angle) * dist;
          
          points.push({ x: px + jx, y: py + jy });
        }
      }
    });

    /* Shuffle images to randomly distribute them */
    const deck = [...IMGS];
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }

    // Append charm image elements directly
    points.forEach((pt, index) => {
      const src = deck[index % deck.length];
      const img = document.createElement('img');
      img.src = src;
      img.className = 'bead-image';

      // Set random offscreen start coordinates for the gather animation
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.max(window.innerWidth, window.innerHeight) * 0.8 + Math.random() * 200;
      const startX = Math.cos(angle) * dist;
      const startY = Math.sin(angle) * dist;

      // Random rotations
      const startRot = Math.round((Math.random() - 0.5) * 540);
      const targetRot = Math.round((Math.random() - 0.5) * 40);

      // Stagger the gather animation
      const delay = (Math.random() * 0.6).toFixed(3);

      img.style.setProperty('--size', `${cell}px`);
      img.style.setProperty('--left', `${pt.x - cell / 2}px`);
      img.style.setProperty('--top', `${pt.y - cell / 2}px`);
      img.style.setProperty('--startX', `${Math.round(startX)}px`);
      img.style.setProperty('--startY', `${Math.round(startY)}px`);
      img.style.setProperty('--startRot', `${startRot}deg`);
      img.style.setProperty('--targetRot', `${targetRot}deg`);
      
      // Delay both gatherBeads and cellFloat
      img.style.animationDelay = `${delay}s, ${(2.0 + parseFloat(delay)).toFixed(3)}s`;

      stage.appendChild(img);
    });
  }

  /* ─── Cursor (scale handled in JS — no CSS !important conflict) ─── */
  const cDot  = document.getElementById('cDot');
  const cRing = document.getElementById('cRing');
  let mx = innerWidth / 2, my = innerHeight / 2;
  let rx = mx, ry = my, rScale = 1;

  document.addEventListener('pointermove', e => {
    mx = e.clientX; my = e.clientY;
    cDot.style.transform = `translate(${mx - 4}px,${my - 4}px)`;
  });
  document.querySelectorAll('a').forEach(el => {
    el.addEventListener('mouseenter', () => { rScale = 1.6; cRing.style.borderColor = '#0e7490'; });
    el.addEventListener('mouseleave', () => { rScale = 1;   cRing.style.borderColor = 'rgba(214, 51, 132, 0.55)'; });
  });
  (function tick() {
    rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
    cRing.style.transform = `translate(${rx - 19}px,${ry - 19}px) scale(${rScale})`;
    requestAnimationFrame(tick);
  })();

  /* ─── Particules + ondulations (identiques à la page d'accueil) ─── */
  const pCanvas = document.querySelector('.particles');
  const pCtx = pCanvas.getContext('2d');
  function fit(c) { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; c.getContext('2d').scale(devicePixelRatio, devicePixelRatio); }
  fit(pCanvas);

  const SHAPES = ['sparkle', 'shell', 'sand', 'star', 'gem'];
  const COLORS = ['#c41e3a', '#d63384', '#f59e0b', '#10b981', '#2dd4bf', '#8b5cf6', '#fff7ec', '#f4e4c1'];

  class Particle {
    constructor(x, y, opts = {}) {
      this.x = x; this.y = y;
      this.vx = opts.vx ?? (Math.random() - 0.5) * 2.2;
      this.vy = opts.vy ?? (Math.random() * -2 - 0.5);
      this.size = opts.size ?? (Math.random() * 6 + 3);
      this.life = 1;
      this.decay = opts.decay ?? 0.008;
      this.gravity = opts.gravity ?? 0.04;
      this.shape = opts.shape ?? SHAPES[(Math.random() * SHAPES.length) | 0];
      this.color = opts.color ?? COLORS[(Math.random() * COLORS.length) | 0];
      this.rot = Math.random() * Math.PI * 2;
      this.spin = (Math.random() - 0.5) * 0.1;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.gravity;
      this.vx *= 0.995;
      this.rot += this.spin;
      this.life -= this.decay;
    }
    draw(ctx) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.life);
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.fillStyle = this.color;
      ctx.strokeStyle = this.color;

      if (this.shape === 'sparkle') {
        const s = this.size;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) { ctx.moveTo(0, 0); ctx.lineTo(0, -s); ctx.rotate(Math.PI / 2); }
        ctx.rotate(Math.PI / 4);
        for (let i = 0; i < 4; i++) { ctx.moveTo(0, 0); ctx.lineTo(0, -s * 0.55); ctx.rotate(Math.PI / 2); }
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.18, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.shape === 'star') {
        const s = this.size;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(0, -s);
          ctx.translate(0, -s);
          ctx.rotate((Math.PI * 2) / 10);
          ctx.lineTo(0, -s * 0.4);
          ctx.translate(0, -s * 0.4);
          ctx.rotate(-(Math.PI * 6) / 10);
        }
        ctx.lineTo(0, -s); ctx.closePath(); ctx.fill();
      } else if (this.shape === 'gem') {
        const s = this.size;
        ctx.beginPath();
        ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.7, 0);
        ctx.closePath(); ctx.fill();
      } else if (this.shape === 'shell') {
        ctx.font = `${this.size * 2.4}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🐚', 0, 0);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  const particles = [];
  let lastEmit = 0;

  document.addEventListener('pointermove', e => {
    const now = performance.now();
    if (now - lastEmit < 40) return;
    lastEmit = now;
    particles.push(new Particle(e.clientX + (Math.random() - 0.5) * 10, e.clientY + (Math.random() - 0.5) * 10, {
      vx: (Math.random() - 0.5) * 1.4,
      vy: (Math.random() - 0.5) * 1.4 - 0.5,
      gravity: 0.02, decay: 0.022,
      size: Math.random() * 5 + 3,
      shape: Math.random() < 0.6 ? 'sparkle' : (Math.random() < 0.5 ? 'star' : 'gem'),
    }));
  }, { passive: true });

  document.addEventListener('click', e => {
    for (let i = 0; i < 24; i++) {
      const a = (Math.PI * 2 * i) / 24;
      particles.push(new Particle(e.clientX, e.clientY, {
        vx: Math.cos(a) * (Math.random() * 4 + 1.5),
        vy: Math.sin(a) * (Math.random() * 4 + 1.5) - 1,
        gravity: 0.06, decay: 0.012,
        size: Math.random() * 7 + 4,
      }));
    }
    spawnRipple(e.clientX, e.clientY, 1.4);
  });

  function ambient() {
    particles.push(new Particle(Math.random() * innerWidth, -10, {
      vx: (Math.random() - 0.5) * 0.3,
      vy: Math.random() * 0.6 + 0.2,
      gravity: 0.005, decay: 0.003,
      size: Math.random() * 2 + 1,
      shape: 'sand',
      color: Math.random() < 0.5 ? '#f4e4c1' : '#fff'
    }));
  }
  setInterval(ambient, 90);

  /* Water ripples */
  const rCanvas = document.querySelector('.ripples');
  const rCtx = rCanvas.getContext('2d');
  fit(rCanvas);

  const ripples = [];
  class Ripple {
    constructor(x, y, strength = 1) {
      this.x = x; this.y = y;
      this.r = 4; this.maxR = 140 * strength;
      this.life = 1; this.decay = 0.018 / strength;
    }
    update() { this.r += 2.4; this.life -= this.decay; }
    draw(ctx) {
      const alpha = Math.max(0, this.life);
      ctx.save();
      ctx.strokeStyle = `rgba(0, 212, 255, ${alpha * 0.6})`;
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(214, 51, 132, ${alpha * 0.4})`;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.7, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  function spawnRipple(x, y, s = 1) { ripples.push(new Ripple(x, y, s)); }

  let lastRipple = 0;
  document.addEventListener('pointermove', e => {
    const now = performance.now();
    if (now - lastRipple > 140) {
      lastRipple = now;
      spawnRipple(e.clientX, e.clientY, 0.6);
    }
  }, { passive: true });

  let tabVisible = !document.hidden;
  document.addEventListener('visibilitychange', () => { tabVisible = !document.hidden; });

  function loop() {
    if (tabVisible) {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      rCtx.clearRect(0, 0, rCanvas.width, rCanvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.update(); p.draw(pCtx);
        if (p.life <= 0 || p.y > innerHeight + 50) particles.splice(i, 1);
      }
      for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i]; r.update(); r.draw(rCtx);
        if (r.life <= 0) ripples.splice(i, 1);
      }
    }
    requestAnimationFrame(loop);
  }
  loop();

  addEventListener('resize', () => { fit(pCanvas); fit(rCanvas); });
  </script>
</body>
</html>
